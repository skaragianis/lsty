[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Keep release/about.toml in step.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # notify and notify-types.
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Argv parsing is hand-written.
deny = [
  { name = "argh" },
  { name = "argparse" },
  { name = "bpaf" },
  # The test runner parses its own test arguments with it.
  { name = "clap", wrappers = ["libtest-mimic"] },
  { name = "clap_builder", wrappers = ["clap"] },
  { name = "clap_lex", wrappers = ["clap_builder"] },
  { name = "docopt" },
  { name = "getopts" },
  { name = "gumdrop" },
  { name = "lexopt" },
  { name = "pico-args" },
  { name = "structopt" },
  { name = "xflags" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
