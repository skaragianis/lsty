# Changelog settings for git-cliff: git cliff --tag vVERSION -o CHANGELOG.md

[changelog]
header = """
# Changelog

Changes a user of lsty can see, newest first.
"""
body = """

{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = """

## 0.1.0 (2026-10-11)

First release.
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only what a user sees: tests, refactors, docs, builds and chores are left out.
filter_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Faster" },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
