# Changelog settings for git-cliff: git cliff --tag vVERSION -o CHANGELOG.md

[changelog]
header = """
# Changelog

Changes that a user of lsty can see, newest first.

<!-- markdownlint-configure-file { "MD013": false, "MD024": { "siblings_only": true } } -->
"""
body = """

{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = """

## 0.1.0 (2026-10-11)

First release.
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only what a user sees: tests, refactors, docs, builds and chores are left out.
filter_commits = true
commit_parsers = [
    # How the demo is recorded is no change a user sees.
    { message = "^[a-z]+\\(demo\\)", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^perf", group = "<!-- 3 -->Faster" },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
