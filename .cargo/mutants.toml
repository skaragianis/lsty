# The properties the fuzz targets check and the fixtures they share with
# the tests, and the scripted-session harness of the TUI tests: a mutant
# there weakens a check, not lsty
exclude_globs = ["fuzzing.rs", "test_util.rs", "**/tuitest/**"]
# Build and test with the versions in the lock file
additional_cargo_args = ["--locked"]
# Test binaries run one test at a time, so the core cap holds
additional_cargo_test_args = ["--", "--test-threads=1"]
exclude_re = [
  # The comparisons and Debug of a load and its reading exist only so that
  # the message and command types can derive theirs; nothing compares or
  # prints one
  "live\\.rs:\\d+:\\d+: .*<impl (PartialEq for (Load|Reading)|std::fmt::Debug for Reading)>::(eq|fmt)",
  # Cancel::new is Cancel::default, so the replacement is the same value
  "run\\.rs:\\d+:\\d+: replace Screen::cancel -> Cancel with Default::default\\(\\)",
  # One call of the tested give_back on standard output; a test of it
  # would write the leave codes to the terminal of the test runner
  "terminal\\.rs:\\d+:\\d+: replace restore_after_panic with \\(\\)",
]
