[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/skaragianis/lsty"

[workspace.dependencies]
lsty-cli = { path = "crates/lsty-cli", version = "0.5.0" }
lsty-core = { path = "crates/lsty-core", version = "0.5.0" }
lsty-scripttest = { path = "crates/lsty-scripttest" }
lsty-tui = { path = "crates/lsty-tui", version = "0.5.0" }

getrandom = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std"] }
libtest-mimic = "0.8"
notify = { version = "8", default-features = false, features = [
  "macos_fsevent",
] }
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
] }
regex = "1"
rustix = "1"
serde_json = "1"
signal-hook = "0.3"
similar = "3"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
toml = { version = "1", default-features = false, features = ["std", "parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Deny panics, debug output and unexplained lint suppressions
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Limit complexity and structural bloat (thresholds in clippy.toml)
cognitive_complexity = "deny"
excessive_nesting = "deny"

# Further lints from the nursery and restriction groups
clone_on_ref_ptr = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
mod_module_files = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
significant_drop_tightening = "warn"
use_self = "warn"
wildcard_enum_match_arm = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
