[package]
name = "lsty"
description = "Terminal lists for Humans and Agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["todo", "todo-txt", "tui", "cli", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "lsty"
path = "src/main.rs"

[dependencies]
jiff = { workspace = true, features = [
  "tz-system",
  "tzdb-zoneinfo",
  "tzdb-concatenated",
] }
lsty-cli.workspace = true
lsty-core.workspace = true
lsty-tui.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true
lsty-scripttest.workspace = true
rustix = { workspace = true, features = ["event", "process", "termios"] }
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "script"
harness = false

[[test]]
name = "process"
harness = false

[[test]]
name = "terminal"
harness = false

[[test]]
name = "bench"
harness = false

[[test]]
name = "todo_sh"
harness = false

[lints]
workspace = true
