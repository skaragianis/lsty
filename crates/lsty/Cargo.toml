[package]
name = "lsty"
description = "A todo list that you and your LLM agents collaborate on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "lsty"
path = "src/main.rs"

[dependencies]
jiff = { workspace = true, features = [
  "tz-system",
  "tzdb-zoneinfo",
  "tzdb-concatenated",
] }
lsty-cli.workspace = true
lsty-core.workspace = true
lsty-tui.workspace = true
signal-hook.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true
lsty-scripttest.workspace = true
rustix = { workspace = true, features = ["fs", "pty", "termios"] }
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "script"
harness = false

[[test]]
name = "process"
harness = false

[[test]]
name = "terminal"
harness = false

[[test]]
name = "todo_sh"
harness = false

[lints]
workspace = true
