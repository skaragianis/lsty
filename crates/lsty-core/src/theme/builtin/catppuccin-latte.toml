blocked             = "maroon"
mode_normal         = { fg = "crust", bg = "blue", bold = true }
mode_insert         = { fg = "crust", bg = "green", bold = true }
mode_visual         = { fg = "crust", bg = "mauve", bold = true }
mode_command        = { fg = "crust", bg = "peach", bold = true }
panel_border        = "surface1"
panel_border_active = "lavender"
selection           = { bg = "surface1" }
cursorline          = { bg = "surface0" }
chip                = { fg = "text", bg = "surface1" }
status_bg           = { bg = "mantle" }
hint_key            = { fg = "lavender", bold = true }
hint_desc           = "subtext0"
warning             = "yellow"
error               = { fg = "red", bold = true }
