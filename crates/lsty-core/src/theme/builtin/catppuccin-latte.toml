[slots]
priority_a          = { fg = "red", bold = true }
priority_b          = "peach"
priority_c          = "yellow"
priority_other      = "subtext0"
project             = "mauve"
context             = "teal"
link                = { fg = "blue", underline = true }
text                = "text"
muted               = "overlay1"
due_overdue         = { fg = "red", bold = true }
due_today           = { fg = "peach", bold = true }
due_soon            = "yellow"
done                = { fg = "overlay0", strike = true, faint = true }
