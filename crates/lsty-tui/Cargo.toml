[package]
name = "lsty-tui"
description = "The terminal interface of lsty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The headless driver that the golden-frame tests use. For the crate's own
# tests only; it is unstable and not part of the supported interface.
harness = ["dep:regex", "dep:tempfile"]

[dependencies]
jiff.workspace = true
lsty-cli.workspace = true
lsty-core.workspace = true
ratatui.workspace = true
rustix = { workspace = true, features = ["event"] }
signal-hook.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
regex = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
notify.workspace = true
toml.workspace = true

[dev-dependencies]
lsty-scripttest.workspace = true
tempfile.workspace = true

[[test]]
name = "golden"
harness = false
required-features = ["harness"]

[lints]
workspace = true
