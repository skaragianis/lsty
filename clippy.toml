allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
cognitive-complexity-threshold = 10
excessive-nesting-threshold = 4
too-many-lines-threshold = 60
too-many-arguments-threshold = 5
type-complexity-threshold = 150

# Everything below the binary gets the process's state injected.
disallowed-methods = [
  { path = "std::env::args", reason = "use cli::Env::args" },
  { path = "std::env::args_os", reason = "use cli::Env::args" },
  { path = "std::env::current_dir", reason = "use cli::Env::cwd" },
  { path = "std::env::current_exe", reason = "use cli::Env::args" },
  { path = "std::env::home_dir", reason = "use cli::Env::home" },
  { path = "std::env::temp_dir", reason = "use cli::Env::vars" },
  { path = "std::env::var", reason = "use cli::Env::vars" },
  { path = "std::env::var_os", reason = "use cli::Env::vars" },
  { path = "std::env::vars", reason = "use cli::Env::vars" },
  { path = "std::env::vars_os", reason = "use cli::Env::vars" },
  { path = "std::process::exit", reason = "return an exit code" },
  { path = "std::time::SystemTime::now", reason = "use the injected clock" },
  { path = "jiff::Timestamp::now", reason = "use the injected clock" },
  { path = "jiff::Zoned::now", reason = "use the injected clock" },
  { path = "jiff::tz::TimeZone::system", reason = "use the injected clock" },
  { path = "jiff::tz::TimeZone::try_system", reason = "use the injected clock" },
  { path = "std::path::Path::display", reason = "use errs::lossy_path" },
  { path = "std::path::Path::to_string_lossy", reason = "use errs::lossy_path" },
  { path = "std::ffi::OsStr::to_string_lossy", reason = "use errs::lossy_path" },
]
