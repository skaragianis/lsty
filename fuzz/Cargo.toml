[package]
name = "lsty-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4"
lsty-core = { path = "../crates/lsty-core" }

# Not a member of the main workspace.
[workspace]

[[bin]]
name = "parse_file"
path = "fuzz_targets/parse_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_append_remove"
path = "fuzz_targets/line_append_remove.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_parse"
path = "fuzz_targets/query_parse.rs"
test = false
doc = false
bench = false
