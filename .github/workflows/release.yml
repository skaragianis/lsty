name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check that the tag names the version in Cargo.toml
        run: |
          id="$(cargo pkgid --locked -p lsty)"
          version="${id##*[#@]}"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: [version, ci]
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: lsty-*
          merge-multiple: true
      - name: List the checksums of all the archives
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create the release with the executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a pre-release part (a `-` before any `+`) is
          # marked as one and never becomes the latest release.
          flags=()
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if view="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null)"; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          elif [ "$view" = "release not found" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          else
            printf '%s\n' "$view" >&2
            exit 1
          fi
