name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check that the tag names the version in Cargo.toml
        run: |
          id="$(cargo pkgid --locked -p lsty)"
          version="${id##*[#@]}"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  licenses:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      - name: Collect the licenses of the code in the executable
        run: |
          mkdir notices
          cargo about generate --locked --fail -m crates/lsty/Cargo.toml \
            -c release/about.toml release/about.hbs \
            -o notices/THIRD-PARTY-LICENSES
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" \
            notices/THIRD-PARTY-LICENSES-std.html
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: notices/
          if-no-files-found: error

  build:
    needs: [version, ci, licenses]
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            linker: rust-lld
            # The executable is static, so qemu-user needs no sysroot.
            prepare: |
              sudo apt-get update
              sudo apt-get install -y qemu-user
            launch: qemu-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            # A no-op where the image already has Rosetta.
            prepare: softwareupdate --install-rosetta --agree-to-license
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: notices
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p lsty --target ${{ matrix.target }}
      - name: Package
        run: |
          name="lsty-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lsty" LICENSE notices/* \
            "dist/$name/"
          case "${{ matrix.target }}" in
            *-musl)
              {
                echo
                echo "=============================================================================="
                echo "musl libc (MIT), linked into this executable"
                echo
                echo "------------------------------------------------------------------------------"
                echo
                cat release/musl-COPYRIGHT
              } >> "dist/$name/THIRD-PARTY-LICENSES"
              ;;
          esac
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Run the executable from its archive
        run: |
          ${{ matrix.prepare }}
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          out="$(${{ matrix.launch }} "$RUNNER_TEMP"/lsty-*/lsty --version)"
          echo "$out"
          case "$out" in
            *"${GITHUB_REF_NAME#v}"*) ;;
            *) echo "unexpected version: $out" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: lsty-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: lsty-*
          merge-multiple: true
      - name: List the checksums of all the archives
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create the release with the executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a pre-release part (a `-` before any `+`) is
          # marked as one and never becomes the latest release.
          flags=()
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          if view="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null)"; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          elif [ "$view" = "release not found" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          else
            printf '%s\n' "$view" >&2
            exit 1
          fi
