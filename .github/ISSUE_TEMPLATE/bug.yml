name: Bug report
description: Something in lsty doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: lsty version
      description: The output of `lsty --version`.
      placeholder: lsty 0.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4, Debian 13, …
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: For problems in the interactive view.
      placeholder: Ghostty, iTerm2, kitty, tmux in Alacritty, …
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. lsty add "Call the bank +home"
        2. lsty do 1
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste any output or error message as text.
    validations:
      required: true
